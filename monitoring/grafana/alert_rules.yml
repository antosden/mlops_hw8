apiVersion: 1

groups:
  - orgId: 1
    name: latency_alerts
    folder: ML Monitoring
    interval: 1m
    rules:
      - uid: high_latency
        title: HighLatency
        condition: C
        for: 2m
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: histogram_quantile(0.95, sum(rate(request_latency_seconds_bucket{endpoint="/predict"}[5m])) by (le))
              instant: false
              intervalMs: 1000
              legendFormat: p95 latency
              maxDataPoints: 43200
              range: true
              refId: A

          - refId: B
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: []
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - B
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              refId: B
              type: reduce

          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 1
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              refId: C
              type: threshold

        noDataState: NoData
        execErrState: Error
        annotations:
          summary: High request latency detected
          description: p95 latency for /predict exceeded 1 second for 2 minutes.
        labels:
          severity: warning
        isPaused: false
