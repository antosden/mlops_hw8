# yaml-language-server: $schema=https://cloud.dqops.com/dqo-yaml-schema/TableYaml-schema.json
apiVersion: dqo/v1
kind: table
spec:
  timestamp_columns:
    event_timestamp_column: created_at
    partition_by_column: created_at
  incremental_time_window:
    daily_partitioning_recent_days: 7
    monthly_partitioning_recent_months: 1
  monitoring_checks:
    daily:
      schema:
        daily_column_count_changed:
          fatal: {}
        daily_column_list_changed:
          fatal: {}
        daily_column_list_or_order_changed:
          fatal: {}
        daily_column_types_changed:
          fatal: {}
  columns:
    event_id:
      type_snapshot:
        column_type: INTEGER
        nullable: false
        precision: 0
      id: true
    user_id:
      type_snapshot:
        column_type: INTEGER
        nullable: false
        precision: 0
    movie_id:
      type_snapshot:
        column_type: INTEGER
        nullable: false
        precision: 0
      monitoring_checks:
        daily:
          nulls:
            daily_nulls_count:
              error:
                max_count: 0
    score:
      type_snapshot:
        column_type: NUMERIC
        nullable: false
        precision: 2
    created_at:
      type_snapshot:
        column_type: TIMESTAMP WITHOUT TIME ZONE
        nullable: false
        precision: 6
